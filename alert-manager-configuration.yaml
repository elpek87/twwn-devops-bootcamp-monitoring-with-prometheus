apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: main-rules-alert-config
  namespace: monitoring
spec:
  route:
    receiver: 'email'
    repeatInterval: 30m
    routes:
    - matchers:
      - name: alertname
        value: HostHighCpuLoad
    - matchers:
      - name: alertname
        value: KubernetesPodCrashLooping
      repeatInterval: 10m
  receivers:
  - name: 'email'
    emailConfigs:
    - to: 'xyz@abc.pl'
      from: 'xyz@abc.pl'
      smarthost: 'mail.abc.pl:587'
      authUsername: 'xyz@abc.pl'
      authIdentity: 'xyz@abc.pl'
      authPassword:
        name: mail-auth
        key: password

